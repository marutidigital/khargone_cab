name: Booking automations

on:
  schedule:
    - cron: '5,35 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: booking-automations
  cancel-in-progress: false

jobs:
  run-booking-automations:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Process match cutoffs and refunds
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: >-
          curl --fail --silent --show-error --retry 2 --retry-all-errors --max-time 60
          -H "Authorization: Bearer ${CRON_SECRET}"
          https://maruticab.in/api/cron/cutoff

      - name: Send ride and feedback reminders
        if: always()
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: >-
          curl --fail --silent --show-error --retry 2 --retry-all-errors --max-time 60
          -H "Authorization: Bearer ${CRON_SECRET}"
          https://maruticab.in/api/cron/reminders
